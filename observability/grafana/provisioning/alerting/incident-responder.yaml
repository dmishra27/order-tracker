apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        # incident-response/responder.py runs on the host, not in Compose.
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
        disableResolveMessage: false

# Provisioning replaces the whole notification policy tree. Every alert in this Grafana
# belongs to order-tracker, so all of them go to the incident responder.
policies:
  - orgId: 1
    receiver: incident-responder
    group_by: [alertname]
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
